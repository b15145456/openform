services:
  - type: web
    name: openform-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: FGA_API_URL
        sync: false
      - key: FGA_API_KEY
        sync: false

  - type: web
    name: openform-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Authorization engine for per-app sharing (owner/editor/viewer). Uses the
  # same Neon Postgres as the backend for persistent storage — otherwise the
  # free plan's spin-down-on-idle would wipe every sharing grant on restart.
  # Secured with a preshared key (OPENFGA_AUTHN_PRESHARED_KEYS) since this
  # service is reachable at a public URL; without it, anyone could call its
  # API directly and grant themselves owner access to any app.
  - type: web
    name: openform-fga
    runtime: image
    plan: free
    image:
      url: docker.io/openfga/openfga:latest
    # Must be the absolute path, not just "run": Render replaces the image's
    # own ENTRYPOINT with this command rather than appending it as CMD args,
    # and the image has no shell/PATH lookup — "run" alone fails instantly
    # with "exec: run: executable file not found in $PATH" and no other
    # output (confirmed locally: `docker run --entrypoint run openfga/openfga`
    # reproduces the exact silent "exited with status 128" seen on Render).
    dockerCommand: /openfga run
    healthCheckPath: /healthz
    envVars:
      - key: OPENFGA_DATASTORE_ENGINE
        value: postgres
      - key: OPENFGA_DATASTORE_URI
        sync: false
      - key: OPENFGA_AUTHN_METHOD
        value: preshared
      - key: OPENFGA_AUTHN_PRESHARED_KEYS
        sync: false
