apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/b15145456/openform.git
    targetRevision: main
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: openform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
