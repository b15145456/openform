apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openform
  namespace: openform
spec:
  ingressClassName: traefik
  rules:
    - host: openform.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openform
                port: { number: 80 }
