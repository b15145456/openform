name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write
  packages: write
jobs:
  test-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: openform
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/openform
      PGSSL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm test
      - run: npm test --workspace backend
      - run: npm run build
  container:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/b15145456/openform:${{ github.sha }}
            ghcr.io/b15145456/openform:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Pin GitOps manifest to immutable image
        run: |
          sed -i "s#ghcr.io/b15145456/openform:[^[:space:]]*#ghcr.io/b15145456/openform:${GITHUB_SHA}#" deploy/k8s/deployment.yaml
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/deployment.yaml
          git commit -m "deploy: promote ${GITHUB_SHA} [skip ci]"
          git push
